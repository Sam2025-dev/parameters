name: Publish

on:
  push:
    branches: [dev]
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  publish:
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "8"
          cache: maven
          server-id: github
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN
      - name: Publish to GitHub Packages
        run: mvn -B -DskipTests deploy
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Attach JAR to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1-SNAPSHOT
          name: 0.1-SNAPSHOT
          target_commitish: ${{ github.sha }}
          files: target/parameters-0.1-SNAPSHOT.jar
          body: |
            GitHub Packages:

            ```xml
            <dependency>
                <groupId>com.github.parameters</groupId>
                <artifactId>parameters</artifactId>
                <version>0.1-SNAPSHOT</version>
            </dependency>
            ```

            Maven Central (after a `v*` tag publish):

            ```xml
            <dependency>
                <groupId>io.github.sam2025-dev</groupId>
                <artifactId>parameters</artifactId>
                <version>0.1</version>
            </dependency>
            ```
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  maven-central:
    name: Maven Central
    if: |
      secrets.CENTRAL_USERNAME != '' &&
      secrets.GPG_PRIVATE_KEY != '' &&
      (startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "8"
          cache: maven
          server-id: central
          server-username: MAVEN_USERNAME
          server-password: MAVEN_PASSWORD
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase: MAVEN_GPG_PASSPHRASE
      - name: Set Maven Central coordinates
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("pom.xml")
          text = path.read_text()
          text = text.replace(
              "<groupId>com.github.parameters</groupId>",
              "<groupId>io.github.sam2025-dev</groupId>",
              1,
          )
          text = text.replace(
              "<version>0.1-SNAPSHOT</version>",
              "<version>0.1</version>",
              1,
          )
          path.write_text(text)
          PY
      - name: Publish to Maven Central
        run: mvn -B -DskipTests -Pcentral deploy
        env:
          MAVEN_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
